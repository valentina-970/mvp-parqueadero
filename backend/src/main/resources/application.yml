spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:parqueadero}
    username: ${POSTGRES_USER:parqueadero_user}
    # Sin valor por defecto: la contraseña sale solo del entorno (archivo .env, que no se sube)
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      cookie:
        # La cookie de sesión no se lee desde JavaScript ni viaja en peticiones de otros sitios
        http-only: true
        same-site: lax
app:
  cors:
    origen: ${CORS_ORIGEN:http://localhost:5173}
  usuarios:
    admin:
      nombre: ${ADMIN_USUARIO:admin}
      contrasena: ${ADMIN_CONTRASENA:}
    operador:
      nombre: ${OPERADOR_USUARIO:operador1}
      contrasena: ${OPERADOR_CONTRASENA:}