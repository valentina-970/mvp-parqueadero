name: Pruebas

# Corre las pruebas en cada pull request hacia develop o main (TT-06)
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Base descartable que existe solo mientras corre el pipeline: no es un secreto real
        env:
          POSTGRES_DB: parqueadero_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: solo-para-pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d parqueadero_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: parqueadero_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: solo-para-pruebas
      ADMIN_CONTRASENA: clave-admin-ci
      OPERADOR_CONTRASENA: clave-operador-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar pruebas unitarias y de arranque
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Guardar el informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas-backend
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Compilar
        run: npm run build
